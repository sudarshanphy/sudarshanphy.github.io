{% include base_path %}

<section class="page__share">
  {% if site.data.ui-text[site.locale].share_on_label %}
    <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</h4>
  {% endif %}

  <!-- ========================= -->
  <!-- FACEBOOK                 -->
  <!-- ========================= -->
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ base_path }}{{ page.url }}"
     class="btn btn--facebook"
     title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} Facebook">
      <i class="fab fa-facebook" aria-hidden="true"></i><span> Facebook</span>
  </a>

  <!-- ========================= -->
  <!-- LINKEDIN                 -->
  <!-- ========================= -->
  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ base_path }}{{ page.url }}"
     class="btn btn--linkedin"
     title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} LinkedIn">
      <i class="fab fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span>
  </a>

  <!-- ========================= -->
  <!-- X / TWITTER              -->
  <!-- ========================= -->
  <a href="https://x.com/intent/post?text={{ base_path }}{{ page.url }}"
     class="btn btn--x"
     title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} X">
      <i class="fab fa-x-twitter" aria-hidden="true"></i><span> X (formerly Twitter)</span>
  </a>

  <!-- ========================= -->
  <!-- GMAIL SHARE (mailto)     -->
  <!-- ========================= -->
  <a href="mailto:?subject={{ page.title | uri_escape }}&body={{ base_path }}{{ page.url | uri_escape }}"
     class="btn btn--email"
     title="Share via Email">
      <i class="fa fa-envelope" aria-hidden="true"></i><span> Email</span>
  </a>

  <!-- ========================= -->
  <!-- COMMENTED OUT OPTIONS    -->
  <!-- ========================= -->

  <!--
  <a href="https://bsky.app/intent/compose?text={{ base_path }}{{ page.url }}" class="btn btn--bluesky">
      <i class="fab fa-bluesky"></i><span> Bluesky</span>
  </a>

  <a href="https://www.addtoany.com/add_to/mastodon?linkurl={{ base_path | append: page.url | url_encode }}" class="btn btn--mastodon">
      <i class="fab fa-mastodon"></i><span> Mastodon</span>
  </a>
	-->

</section>
